<!--
  Atom 1298: un átomo con sus dos órbitas y el núcleo.
  Origen del pack: pack "Minimal UI Icons" de
  https://www.svgrepo.com/collection/minimal-ui-icons/ (rehospedado en svgrepo,
  que es de donde salió la petición: la ficha
  https://www.svgrepo.com/svg/511492/atom-1298).
  Descarga: la ruta /download da 429 por el checkpoint de Vercel; sí sirve la
  /show, que es la misma imagen: https://www.svgrepo.com/show/511492/atom-1298.svg
  El path y el viewBox son los del original (Sketch deja las coordenadas en miles y
  las compensa con dos grupos translate que suman -164 -2239), pero el dibujo
  mide 26,2 unidades de lado y centrado en el 10, o sea que en el viewBox de 20 se
  salía 3,1 por cada lado y no se veía nada (medido: el getBBox daba la caja en
  167 x 2238 y el path se dibujaba en y=2927 px de pantalla). Por eso el path
  lleva aquí un único transform que aplica el desplazamiento y además lo reduce a
  19,4 unidades de lado, con el centro en el 10,10 del viewBox y 0,3 de margen.
  El color va en currentColor para que el mismo fichero valga en línea (hereda de
  `color`) y como máscara en `mask-image` (donde solo cuenta el alfa).
-->
