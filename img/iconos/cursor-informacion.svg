<!-- Cursor del plugin miPlugin_information: una cruz de precisión con una
     insignia "i". Los colores van fijos porque el navegador pinta el SVG
     como imagen de cursor y ahí no funcionan currentColor ni las variables
     CSS. El punto activo de la cruz está en (12, 12). -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g stroke="#1b1b1b" stroke-width="4" stroke-linecap="round">
    <line x1="12" y1="2" x2="12" y2="8"/>
    <line x1="12" y1="16" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="8" y2="12"/>
    <line x1="16" y1="12" x2="22" y2="12"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <line x1="12" y1="2" x2="12" y2="8"/>
    <line x1="12" y1="16" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="8" y2="12"/>
    <line x1="16" y1="12" x2="22" y2="12"/>
  </g>
  <circle cx="24" cy="24" r="7" fill="#1b1b1b"/>
  <circle cx="24" cy="24" r="5.5" fill="#71A7D3"/>
  <text x="24" y="27.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="bold" fill="#ffffff">i</text>
</svg>
