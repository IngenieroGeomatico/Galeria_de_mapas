<!DOCTYPE html>

<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="cnig" content="yes">

  <title>Estereoscopía</title>

  <!-- fichero estilos de la API (implementación OpenLayers de arranque) -->
  <link href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />

  <!-- CRÍTICO (debe ir ANTES de API-IDEE / MapLibre):
       Fuerza preserveDrawingBuffer:true en TODO contexto WebGL. MapLibre GL
       crea su canvas con preserveDrawingBuffer:false, lo que hace que
       drawImage()/texImage2D() del canvas de MapLibre devuelva píxeles vacíos.
       Sin esto, la capa MapLibre NO aparece en el anaglifo (impl. OpenLayers)
       y la captura del ojo izquierdo falla en Cesium. -->
  <script type="text/javascript">
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") {
          attrs = attrs || {};
          attrs.preserveDrawingBuffer = true;
        }
        return orig.call(this, type, attrs);
      };
    })();
  </script>

  <!-- Ficheros javascript de la API (arranque en OpenLayers; cambioImpl
       intercambia .ol.min <-> .cesium.min al pulsar el botón). -->
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>

  <!-- geotiff.js (decodificación del MDT del WCS del IGN) lo carga el propio

  <!-- Extensión: estereoscopía (anaglifo / vista partida) -->
  <link type="text/css" rel="stylesheet" href="../../ext/estereoscopia/estereoscopia.css">
  <script src="../../ext/estereoscopia/estereoscopia.js" type="text/javascript"></script>
