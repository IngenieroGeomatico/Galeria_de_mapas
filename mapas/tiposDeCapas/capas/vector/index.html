       sobre estos mismos src/href, asi que las rutas locales sirven igual. -->

  <script src="../../../../js/api-idee/browser-polyfill.js"></script>
  <script src="../../../../js/api-idee/apiidee-1.1.0.ol.min.js"></script>
  <script src="../../../../js/api-idee/configuration-1.1.0.js"></script>

  <!-- Arbol de capas -->
  <link rel="stylesheet" href="../../../../ext/selectorCapas/ext_layerSwitcher.css">
  <script src="../../../../ext/selectorCapas/ext_layerSwitcher.js"></script>

  <!-- Cambio 2D / 3D -->
  <link rel="stylesheet" href="../../../../ext/cambioImpl/cambioImpl.css">
  <script src="../../../../ext/cambioImpl/cambioImpl.js"></script>

  <!-- Codigo de la capa -->
  <link rel="stylesheet" href="../../../../ext/modal/modal.css">

</head>

<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">Vector <span class="barra__clase">IDEE.layer.Vector</span></h1>
      <p class="barra__desc">
        Geometrías creadas en memoria, sin pedir nada a la red: la capa se crea vacía y se le añaden entidades.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.Vector</h3>
    <p>
      La capa se crea con su estilo y luego se le pasan las entidades con <code>addFeatures</code>. Las coordenadas van en EPSG:3857, el sistema del mapa.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.Vector({
  name: 'Vector',
  legend: 'Geometrias en memoria',
}, {
  style: new IDEE.style.Generic({
    polygon: {
      fill: { color: '#ffb257', opacity: 0.35 },
      stroke: { color: '#b45309', width: 2 },
    },
    point: {
      radius: 7,
      fill: { color: '#5eead4' },
      stroke: { color: '#0f766e', width: 2 },
    },
  }),
});
mapajs.addLayers(capa);

capa.addFeatures([
  new IDEE.Feature('cibeles', {
    type: 'Feature',
    id: 'cibeles',
    geometry: { type: 'Point', coordinates: [-412105, 4928833] },
    properties: { nombre: 'Cibeles' },
  }),
  new IDEE.Feature('retiro', {
    type: 'Feature',
    id: 'retiro',
    geometry: {
      type: 'Polygon',
      coordinates: [[
        [-410500, 4923000],
        [-403500, 4923000],
        [-403500, 4928500],
        [-410500, 4928500],
        [-410500, 4923000],
      ]],
    },
    properties: { nombre: 'Parque del Retiro' },
  }),
]);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>

</html>
