      <h1 class="barra__titulo">GLB <span class="barra__clase">IDEE.layer.glb</span></h1>
      <p class="barra__desc">
        Modelos glTF/GLB sin georreferenciación propia, colocados con
        <code>position</code> o con <code>bbox</code>; en 2D se dibuja su huella.
      </p>
    </div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.glb</h3>
    <p>
      Un <code>.glb</code> es una malla 3D y no guarda ni dónde va ni cómo se
      orienta. Esta extensión (<code>ext/glbLayer</code>) añade a la API una
      capa que lo coloca en el globo y, en 2D, dibuja su huella.
    </p>
    <pre><code>new IDEE.layer.glb({
  url: 'modelo.glb',
  // Punto de colocación (lon/lat en EPSG:4326)
  position: { lon: -0.8793, lat: 41.6566, height: 0 },
  // O un rectángulo: manda sobre `position` y es la huella en 2D
  // bbox: [-0.8795, 41.6560, -0.8777, 41.6566],
  heading: 20,      // grados, horario desde el norte
  pitch: 0,
  roll: 0,
  scale: 0.35,      // número o { x, y, z }
  heightOffset: 0,  // metros
  baseAlSuelo: true,
  ajustarABbox: false, // con bbox: escala el modelo para encajarlo
});</code></pre>
    <p>
      Si llegan <code>bbox</code> y <code>position</code> a la vez, manda el
      <code>bbox</code>: su centro es el punto de colocación y de
      <code>position</code> solo se aprovecha la altura. La huella 2D sale del
      <code>bbox</code> o, si no lo hay, de la extensión real del modelo
      (leída del JSON del glTF).
    </p>
  </template>
