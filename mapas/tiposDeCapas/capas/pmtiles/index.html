      <h1 class="barra__titulo">PMTiles <span class="barra__clase">ext/pmtilesLayer</span></h1>
      <p class="barra__desc">
        Los barrios de Madrid en dos ficheros PMTiles: teselas vectoriales (MVT)
        y teselas ráster (PNG), leídos por HTTP Range.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.PMTiles (ext/pmtilesLayer)</h3>
    <p>
      PMTiles guarda todas las teselas y el directorio en un solo fichero. La
      extensión lo lee con <code>HTTP Range</code> y crea:
    </p>
    <ul>
      <li>
        <strong>Vectorial</strong> (<code>type: 'vector'</code>): una capa
        <code>IDEE.layer.MVT</code> a la que se le cambia la carga de tesela por
        <code>pmtiles.getZxy()</code>. En 3D la fachada MVT no dibuja teselas,
        así que este ejemplo solo la añade en 2D.
      </li>
      <li>
        <strong>Ráster</strong> (<code>type: 'raster'</code>): una capa
        <code>IDEE.layer.TMS</code> cuya fuente (2D) o <code>ImageryLayer</code>
        (3D) se sustituye por un proveedor PMTiles.
      </li>
    </ul>
    <pre class="codigo"><code>// Vectorial (solo 2D)
const capaVector = new IDEE.layer.PMTiles({
  url: '../../../../datos/Madrid_barrios.pmtiles',
  type: 'vector',
  layers: 'barrios',
  name: 'Barrios (vectorial)',
  legend: 'Barrios de Madrid (PMTiles vectorial)',
  minZoom: 0,
  maxZoom: 14,
}, {
  style: new IDEE.style.Generic({
    polygon: {
      fill: { color: '#5eead4', opacity: 0.25 },
      stroke: { color: '#0f766e', width: 2 },
    },
  }),
});

// Ráster (2D y 3D)
const capaRaster = new IDEE.layer.PMTiles({
  url: '../../../../datos/Madrid_barrios_raster.pmtiles',
  type: 'raster',
  name: 'Barrios (ráster)',
  legend: 'Barrios de Madrid (PMTiles ráster)',
  minZoom: 0,
  maxZoom: 13,
}, {});

mapajs.addLayers(capaRaster);
if (checkImpl() !== 'cesium') mapajs.addLayers(capaVector);</code></pre>
  </template>
