<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">WFS <span class="barra__clase">IDEE.layer.WFS</span></h1>
      <p class="barra__desc">
        Entidades geográficas que se descargan enteras y se dibujan en el cliente. Aquí,
        los yacimientos arqueológicos declarados en Navarra: un millar de puntos de un solo WFS.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.WFS</h3>
    <p>
      El WFS necesita el espacio de nombres (<code>namespace</code>) y el nombre del
      tipo de entidad (<code>name</code>): juntos forman el <code>typeName</code>.
      La API pide antes el <code>DescribeFeatureType</code> para saber qué geometría trae
      y después descarga todas las entidades.
    </p>
    <p>
      El formato de salida, si no se indica otra cosa, es GeoJSON
      (<code>application/json</code>). El servicio devuelve las coordenadas en el
      sistema del mapa y la capa las trata como GeoJSON estándar.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.WFS({
  url: 'https://idena.navarra.es/ogc/wfs?',
  namespace: 'IDENA',
  name: 'PATRIM_Sym_BICarqueo',
  legend: 'Yacimientos arqueologicos (WFS)',
}, {});

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>
