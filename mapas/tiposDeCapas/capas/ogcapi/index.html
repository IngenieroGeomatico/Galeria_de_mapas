      <h1 class="barra__titulo">OGC API Features <span class="barra__clase">IDEE.layer.OGCAPIFeatures</span></h1>
      <p class="barra__desc">
        Una colección de un servicio OGC API Features, pedida por su nombre. Es el sustituto moderno del WFS.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.OGCAPIFeatures</h3>
    <p>
      La capa necesita la URL del servicio y el nombre de la colección (<code>name</code>). El resto lo negocia la API: formato, sistema de referencia y paginación. El servicio devuelve diez objetos por defecto, así que <code>limit</code> pide todos los de la colección.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.OGCAPIFeatures({
  url: 'https://api-features.idee.es/collections/',
  name: 'falls',
  limit: 300,
  legend: 'Cascadas (OGC API Features)',
}, {
  style: new IDEE.style.Generic({
    point: {
      radius: 5,
      fill: { color: '#2563eb' },
      stroke: { color: '#ffffff', width: 1 },
    },
  }),
});

mapajs.addLayers(capa);</code></pre>
  </template>
