<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>XYZ | Tipos de capa</title>
  <meta name="description" content="Capa XYZ de la API-IDEE: teselas por z, x e y, en 2D y en 3D.">

  <link rel="icon" href="data:,">

  <!-- API-IDEE en local. cambioImpl cambia '.ol.min.js' por '.cesium.min.js'
       sobre estos mismos src/href, asi que las rutas locales sirven igual. -->
  <link href="../../../../js/api-idee/apiidee-1.1.0.ol.min.css" rel="stylesheet">
  <script src="../../../../js/api-idee/browser-polyfill.js"></script>
  <script src="../../../../js/api-idee/apiidee-1.1.0.ol.min.js"></script>
  <script src="../../../../js/api-idee/configuration-1.1.0.js"></script>

  <!-- Arbol de capas -->
  <link rel="stylesheet" href="../../../../ext/selectorCapas/ext_layerSwitcher.css">
  <script src="../../../../ext/selectorCapas/ext_layerSwitcher.js"></script>

  <!-- Cambio 2D / 3D -->
  <link rel="stylesheet" href="../../../../ext/cambioImpl/cambioImpl.css">
  <script src="../../../../ext/cambioImpl/cambioImpl.js"></script>

  <!-- Codigo de la capa -->
  <link rel="stylesheet" href="../../../../ext/modal/modal.css">
  <script src="../../../../ext/modal/modal.js"></script>

  <!-- Estilos comunes de las paginas de tipo de capa -->
  <link rel="stylesheet" href="../../css/capa.css">
</head>

<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">XYZ <span class="barra__clase">IDEE.layer.XYZ</span></h1>
      <p class="barra__desc">
        Teselas por z, x e y. Cualquier servicio de mosaicos que siga esa numeración entra sin más.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.XYZ</h3>
    <p>
      La URL lleva <code>{z}</code>, <code>{x}</code> e <code>{y}</code> en ese orden. <code>crossOrigin</code> va en las opciones de la fuente para que el lienzo no se contamine al leer píxeles.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.XYZ({
  url: 'https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
  name: 'Carto',
  legend: 'Teselas XYZ (Carto)',
}, { crossOrigin: 'anonymous' });

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>

</html>
