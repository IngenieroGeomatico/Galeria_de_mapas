<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">MapLibre <span class="barra__clase">IDEE.layer.MapLibre</span></h1>
      <p class="barra__desc">
        Un style.json completo de MapLibre, con sus capas, sus colores y sus teselas.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.MapLibre</h3>
    <p>
      La capa se declara solo con la URL del <code>style.json</code>: dentro van las fuentes, las capas y los estilos. La API monta el lienzo de MapLibre encima del mapa.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.MapLibre({
  url: 'https://vt-btn.idee.es/files/styles/BTN_Completa.json',
  name: 'BTN',
  legend: 'Base Topografica Nacional (MapLibre)',
}, {});

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>
