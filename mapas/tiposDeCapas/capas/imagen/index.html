<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">Imagen <span class="barra__clase">IDEE.layer.image</span></h1>
      <p class="barra__desc">
        Imágenes sin georreferenciación propia colocadas con <code>position</code>
        o con <code>bbox</code>, con giro, escala e inclinación.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.image</h3>
    <p>
      Una imagen (PNG/JPEG/WebP) no sabe dónde va. Esta extensión
      (<code>ext/imageLayer</code>) añade a la API una capa que la coloca en el
      globo y la gira, la escala y, en 3D, la inclina.
    </p>
    <pre><code>new IDEE.layer.image({
  url: 'plano.jpg',
  // Rectangulo: manda sobre `position` y define el tamano de la imagen
  bbox: [-0.8795, 41.6560, -0.8777, 41.6566],
  // ...o un punto (centro de la imagen) con su tamano en metros
  // position: { lon: -0.8768, lat: 41.6554, height: 0 },
  // ancho: 70, alto: 30,
  heading: 25,      // grados, horario desde el norte
  pitch: 0,         // solo 3D: inclina la imagen (plano 3D)
  roll: 0,
  scale: 1,         // numero o { x, y }
  heightOffset: 0,  // metros
  clampToGround: true,
});</code></pre>
    <p>
      Con <code>bbox</code> la rotación y la escala se siguen aplicando, alrededor
      del centro del rectángulo. En 2D la imagen se dibuja nítida sobre las cuatro
      esquinas de su huella; en 3D se apoya en el terreno salvo que tenga
      <code>pitch</code>/<code>roll</code>, que se dibuja como plano inclinado.
    </p>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>

</html>
