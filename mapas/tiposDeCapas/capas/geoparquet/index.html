<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">GeoParquet <span class="barra__clase">ext/geoparquetLayer</span></h1>
      <p class="barra__desc">
        Un fichero .parquet de los barrios de Madrid, leído en 2D y en 3D como
        <code>IDEE.layer.GeoParquet</code>.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.GeoParquet (ext/geoparquetLayer)</h3>
    <p>
      La extensión lee el <code>.parquet</code> con <code>hyparquet</code> y crea
      una capa vectorial nativa (<code>IDEE.layer.GeoParquet</code>, subclase de
      <code>IDEE.layer.GeoJSON</code>), que pinta en 2D y en 3D.
    </p>
    <p>
      Arranca en modo <strong>«La vista»</strong>: pide el footer por
      <code>HTTP Range</code>, elige solo los <em>row groups</em> que caen en el
      bbox visible y descarga esos rangos. El fichero completo se lee cuando se
      elige <strong>«Todas»</strong> en el panel de la capa
      (<code>ext/bboxFeatures</code>).
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.GeoParquet({
  url: '../../../../datos/Madrid_barrios.parquet',
  name: 'Barrios de Madrid',
  legend: 'Barrios de Madrid (GeoParquet)',
  crs: 'EPSG:4326',   // opcional: si no, se lee del metadata geo
}, {
  style: new IDEE.style.Generic({
    polygon: {
      fill: { color: '#93c5fd', opacity: 0.35 },
      stroke: { color: '#1d4ed8', width: 2 },
    },
  }),
});

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>
