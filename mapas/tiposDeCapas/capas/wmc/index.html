<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">WMC <span class="barra__clase">IDEE.layer.WMC</span></h1>
      <p class="barra__desc">
        Un contexto de mapas OGC: un XML que ya trae las capas montadas y el encuadre. La API lo abre, añade lo que describe y lleva la vista a su sitio.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.WMC</h3>
    <p>
      El WMC se declara solo con la URL del contexto y un nombre. Al añadirlo al mapa, la API lee el XML, crea las capas que describe, con sus estilos y su orden, y lleva la vista al encuadre guardado.
    </p>
    <p>
      Un WMC entra con su propio encuadre y su propia proyección, y al cargarse la API
      recalcula las resoluciones del mapa. Por eso el mapa se declara con
      <code>projection</code> y <code>resolutions</code> explícitas: así el contexto no le
      cambia el sistema de referencia ni deja la vista sin zoom.
    </p>
    <pre class="codigo"><code>// El WMC trae su encuadre y su proyeccion: el mapa se declara con
// projection y resolutions para que no se las cambie.
const capa = new IDEE.layer.WMC({
  url: '../../datos/contexto.xml',
  name: 'Contexto',
  legend: 'Contexto WMC',
}, {});

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>
