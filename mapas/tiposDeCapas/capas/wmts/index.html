<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">WMTS <span class="barra__clase">IDEE.layer.WMTS</span></h1>
      <p class="barra__desc">
        Teselas pregeneradas por el servicio, con su matriz de niveles. La API lee las capacidades del WMTS para saber qué capas, formatos y estilos ofrece antes de pedir la primera tesela.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.WMTS</h3>
    <p>
      El WMTS se declara con la URL del servicio y el nombre de la capa. La API descarga las capacidades (<code>GetCapabilities</code>) y toma de ahí la matriz de teselas y el formato.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.WMTS({
  url: 'https://www.ign.es/wmts/pnoa-ma?',
  name: 'OI.OrthoimageCoverage',
  matrixSet: 'GoogleMapsCompatible',
  legend: 'Ortofoto PNOA (WMTS)',
}, {});

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>
