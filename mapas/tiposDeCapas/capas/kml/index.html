  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">

    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa

      <h1 class="barra__titulo">KML <span class="barra__clase">IDEE.layer.KML</span></h1>
      <p class="barra__desc">
        Un KML de Google Earth, con sus estilos y sus globos de información, leído tal cual.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.KML</h3>
    <p>
      El KML se declara con la URL del fichero. La API lo descarga, lo parsea y respeta los estilos y las descripciones que traiga.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.KML({
  url: 'https://componentes.idee.es/estaticos/Datos/KML/arbda_sing_se.kml',
  name: 'KML',
  legend: 'Arboles singulares de Sevilla (KML)',
}, {});

mapajs.addLayers(capa);</code></pre>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>
