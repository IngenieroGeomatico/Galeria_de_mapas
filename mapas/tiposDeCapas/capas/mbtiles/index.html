<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">MBTiles <span class="barra__clase">IDEE.layer.MBTiles</span></h1>
      <p class="barra__desc">
        Mosaicos empaquetados en un fichero SQLite. La API lo descarga y lee las teselas del contenedor.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.MBTiles</h3>
    <p>
      El MBTiles apunta a un fichero <code>.mbtiles</code>. Este de ejemplo es el del proyecto <code>node-mbtiles</code>: el mundo entero entre los niveles 0 y 4.
    </p>
    <pre class="codigo"><code>const capa = new IDEE.layer.MBTiles({
  url: 'https://raw.githubusercontent.com/mapbox/node-mbtiles/master/test/fixtures/plain_1.mbtiles',
  name: 'MBTiles',
  legend: 'MBTiles de ejemplo (z0-4)',
  maxZoomLevel: 4,
}, {});

mapajs.addLayers(capa);</code></pre>
    <p>El zoom máximo lo pone el propio contenedor: por eso la capa declara <code>maxZoomLevel: 4</code> y el mapa se queda en ese nivel.</p>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>
