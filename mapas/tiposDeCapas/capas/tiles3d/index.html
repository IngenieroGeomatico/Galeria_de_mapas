    <div class="barra__texto">
      <h1 class="barra__titulo">3D Tiles <span class="barra__clase">IDEE.layer.Tiles3D</span></h1>
      <p class="barra__desc">
        Mallas 3D servidas por teselas con nivel de detalle: el formato que pinta Cesium. En 2D la
        API no las dibuja, así que aquí se enseña la huella que declara el propio tileset.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.Tiles3D</h3>
    <p>
      Los 3D Tiles son un estándar OGC para servir geometría 3D por teselas: cada nodo del árbol
      trae su nivel de detalle y el cliente pide solo lo que ve. La capa se declara con la URL del
      <code>tileset.json</code>.
    </p>
    <p>
      En 3D la API crea el <code>Cesium3DTileset</code> y lo pinta sobre el globo. En 2D no hay
      implementación —OpenLayers no dibuja 3D Tiles—, así que la página lee la región del
      <code>boundingVolume</code> del tileset y dibuja su huella con una capa <code>Vector</code>:
      al menos se ve dónde está y qué extensión ocupa.
    </p>
    <pre class="codigo"><code>// 3D: la capa real
const capa = new IDEE.layer.Tiles3D({
  url: 'https://s3.eu-west-2.wasabisys.com/ems-sgct-photomaillage/' +
    'ODACIT/EMS_PM2022/tileset.json',
  name: 'OdaCit',
  legend: 'Od@CiT Estrasburgo (3D Tiles)',
}, {});

mapajs.addLayers(capa);</code></pre>
    <pre class="codigo"><code>// 2D: la huella de su boundingVolume
const grados = (rad) => (rad * 180) / Math.PI;
const [w, s, e, n] = tileset.root.boundingVolume.region.map(grados);
const [x1, y1] = await IDEE.utils.reproject([w, s], 'EPSG:4326', 'EPSG:3857');
const [x2, y2] = await IDEE.utils.reproject([e, n], 'EPSG:4326', 'EPSG:3857');
// ...y con esas esquinas se crea el poligono de una capa Vector</code></pre>
  </template>
