<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>IFC | Tipos de capa</title>
  <meta name="description" content="Capa IFC de la galería: modelo BIM/IFC cargado en 3D (glTF/3D Tiles) y su huella en 2D.">

  <link rel="icon" href="data:,">

  <!-- API-IDEE en local. cambioImpl cambia '.ol.min.js' por '.cesium.min.js'
       sobre estos mismos src/href, asi que las rutas locales sirven igual. -->
  <link href="../../../../js/api-idee/apiidee-1.1.0.ol.min.css" rel="stylesheet">
  <script src="../../../../js/api-idee/browser-polyfill.js"></script>
  <script src="../../../../js/api-idee/apiidee-1.1.0.ol.min.js"></script>
  <script src="../../../../js/api-idee/configuration-1.1.0.js"></script>

  <!-- Selector de capas base -->
  <link rel="stylesheet" href="../../../../ext/selectorCapas/ext_backgorundLayers.css">
  <script src="../../../../ext/selectorCapas/ext_backgorundLayers.js"></script>

  <!-- Arbol de capas superpuestas -->
  <link rel="stylesheet" href="../../../../ext/selectorCapas/ext_layerSwitcher.css">
  <script src="../../../../ext/selectorCapas/ext_layerSwitcher.js"></script>

  <!-- Lectura de escala y coordenadas -->
  <link rel="stylesheet" href="../../../../ext/mapInfo/mapInfo.css">
  <script src="../../../../ext/mapInfo/mapInfo.js"></script>

  <!-- Cambio 2D / 3D -->
  <link rel="stylesheet" href="../../../../ext/cambioImpl/cambioImpl.css">
  <script src="../../../../ext/cambioImpl/cambioImpl.js"></script>

  <!-- Codigo de la capa -->
  <link rel="stylesheet" href="../../../../ext/modal/modal.css">
  <script src="../../../../ext/modal/modal.js"></script>
  <!-- Informacion del punto -->
  <link rel="stylesheet" href="../../../../ext/information/information.css">
  <script src="../../../../ext/information/information.js"></script>

  <!-- Capa IFC: instala IDEE.layer.IFC -->
  <script src="../../../../ext/ifcLayer/ifcLayer.js"></script>

  <!-- Estilos comunes de las paginas de tipo de capa -->
  <link rel="stylesheet" href="../../css/capa.css">
</head>

<body>

  <div id="cargaSVG">
    <img src="../../../../img/iconos/gear-spinner.svg" alt="Cargando">
  </div>

  <header class="barra">
    <a class="barra__volver" href="../../index.html">
      <span aria-hidden="true">&#8592;</span> Tipos de capa
    </a>
    <div class="barra__texto">
      <h1 class="barra__titulo">IFC <span class="barra__clase">IDEE.layer.IFC</span></h1>
      <p class="barra__desc">
        Modelo BIM (IFC) cargado en 3D a través de <code>ext/ifcLayer</code>;
        en 2D se dibuja su huella.
      </p>
    </div>
  </header>

  <div id="mapaDIV"></div>

  <!-- Codigo que abre el boton del modal. Es el mismo que ejecuta js/mapa.js. -->
  <template id="codigo">
    <h3>IDEE.layer.IFC</h3>
    <p>
      IFC (<em>Industry Foundation Classes</em>) es el formato estándar de
      intercambio de modelos BIM. Cesium no lo lee de serie, por lo que esta
      extensión carga el recurso publicado (glTF/GLB o 3D Tiles resultantes de
      la conversión del IFC) sobre el viewer de Cesium; en 2D se pinta la
      huella del modelo.
    </p>
  </template>

  <script src="../../js/comun.js"></script>
  <script src="./js/mapa.js"></script>

</body>

</html>
