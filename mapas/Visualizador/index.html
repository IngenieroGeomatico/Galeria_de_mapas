<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Visualizador</title>

  <!-- favicon transparente para evitar el 404 de /favicon.ico -->
  <link rel="icon" href="data:,">

  <!-- fichero estilos de la API (implementación OpenLayers) -->
  <link href="../../js/api-idee/apiidee-1.1.0.ol.min.css" rel="stylesheet" />

  <!-- Ficheros javascript de la API -->
  <script type="text/javascript" src="../../js/api-idee/browser-polyfill.js"></script>
  <script type="text/javascript" src="../../js/api-idee/apiidee-1.1.0.ol.min.js"></script>
  <script type="text/javascript" src="../../js/api-idee/configuration-1.1.0.js"></script>

  <!-- Extensiones personalizadas: selector de capas (base + overlay) -->
  <link type="text/css" rel="stylesheet" href="../../ext/selectorCapas/ext_backgorundLayers.css">
  <script src="../../ext/selectorCapas/ext_backgorundLayers.js" type="text/javascript"></script>
  <link type="text/css" rel="stylesheet" href="../../ext/selectorCapas/ext_layerSwitcher.css">
  <script src="../../ext/selectorCapas/ext_layerSwitcher.js" type="text/javascript"></script>

  <!-- Lectura de escala y nivel de zoom (sustituye al control 'scale' de la API,
       que Cesium no sabe construir y aborta el mapa al cambiar a 3D). Necesita la
       banda reservada de controles. -->
  <link type="text/css" rel="stylesheet" href="../../ext/areaControls/areaControls.css">
  <script src="../../ext/areaControls/areaControls.js" type="text/javascript"></script>
  <link type="text/css" rel="stylesheet" href="../../ext/mapInfo/mapInfo.css">
  <script src="../../ext/mapInfo/mapInfo.js" type="text/javascript"></script>

  <!-- Catálogo de servicios y capas (catálogo por secciones + añadir por URL) -->
  <link type="text/css" rel="stylesheet" href="../../ext/catalogo/catalogo.css">
  <!-- El orden importa: catalogo_idee.js se cuelga del registro IDEE.catalog que
       crea catalogo.js, y catalogo_url.js es el que resuelve las URLs. -->
  <script src="../../ext/catalogo/catalogo_idee.js" type="text/javascript"></script>
  <script src="../../ext/catalogo/catalogo_url.js" type="text/javascript"></script>
  <script src="../../ext/catalogo/catalogo_registro.js" type="text/javascript"></script>
  <script src="../../ext/catalogo/catalogo.js" type="text/javascript"></script>

  <!-- estilo propio del visualizador -->
  <link href="./css/mapa.css" rel="stylesheet" />

  <link type="text/css" rel="stylesheet" href="../../ext/cambioImpl/cambioImpl.css">
  <script src="../../ext/cambioImpl/cambioImpl.js" type="text/javascript"></script>

</head>

<body>

  <!-- Div carga -->
  <div id="cargaSVG">
    <img src="../../img/iconos/gear-spinner.svg">
  </div>

  <!-- Contenedor principal del mapa -->
  <div id="mapaDIV"></div>

  <script type="text/javascript" src="./js/mapa.js"></script>

</body>

</html>
