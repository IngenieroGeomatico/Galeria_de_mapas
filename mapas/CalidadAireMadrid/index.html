<!-- Start Popup Content -->
<div id="popup-box">
    <div class="popup-section">
        <h3>Visualizador realizado con la API-CNIG</h3>
        <p class="popup-title">API-CNIG</p>
        <p>API-CNIG es una librería en javascript que permite realizar visualizadores cartográficos de forma gratuita. 
            Los enlaces de interés de API-CNIG son:</p>
        <p>Página principal del proyecto: <a target="_blank"  href="https://plataforma.idee.es/cnig-api">https://plataforma.idee.es/cnig-api</a></p>
        <p>Enlace al repositorio: <a target="_blank" href="https://github.com/IGN-CNIG/API-CNIG">https://github.com/IGN-CNIG/API-CNIG</a></p>
        <p>Enlace a la galería de plugins: <a target="_blank"  href="http://componentes.cnig.es/api-core/test.html">http://componentes.cnig.es/api-core/test.html</a></p>
        <p>Enlace a la Wiki de API-CNIG: <a target="_blank" href="https://github.com/IGN-CNIG/API-CNIG/wiki">https://github.com/IGN-CNIG/API-CNIG/wiki</a></p>
        <p>Enlace a la galería de ejemplos: <a target="_blank"  href="https://plataforma.idee.es/resources/GaleriaEjemplos_APICNIG/">https://plataforma.idee.es/resources/GaleriaEjemplos_APICNIG/</a></p>
    </div>
    <div class="popup-section">
        <p class="popup-title">Datos del visualizador: Datos en tiempo real de la calidad del aire</p>
        <p>Los datos en tiempo real son obtenidos de: <a target="_blank" href="https://datos.madrid.es/sites/v/index.jsp?vgnextoid=41e01e007c9db410VgnVCM2000000c205a0aRCRD&vgnextchannel=374512b9ace9f310VgnVCM100000171f5a0aRCRD">Datos abiertos Madrid</a></p>
        <p>Los datos de las estaciones son obtenidos de: <a target="_blank"  href="https://datos.madrid.es/portal/site/egob/menuitem.c05c1f754a33a9fbe4b2e4b284f1a5a0/?vgnextoid=9e42c176313eb410VgnVCM1000000b205a0aRCRD&vgnextchannel=374512b9ace9f310VgnVCM100000171f5a0aRCRD&vgnextfmt=default">Datos abiertos Madrid</a></p>
        <p>A partir de estos datos, se crea una capa por cada una de los tipos de medidas realizados y se realiza una interpolación de los datos.</p>
        <p>Para las rampas de color de las isobandas, se ha utilizado el siguiente <a target="_blank"  href="https://document.airnow.gov/technical-assistance-document-for-the-reporting-of-daily-air-quailty.pdf">Documento sobre el índice de calidad del aire</a></p>
    </div>
</div>
