  <!-- Ficheros javascript de la API-CNIG. Deben cargarse ANTES de las extensiones
       de abajo: al registrarse un plugin se hace window.IDEE.plugin.X = X, y si la
       API todavia no existe esa registracion se pierde en cuanto el bundle reemplaza
       window.IDEE, que es lo que hacia fallar IDEE.plugin.miPlugin_cambioImpl con
       "is not a constructor". Mismo orden que en mapas/PuntosHistoricosMadrid. -->
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>

  <!-- Controles 2D del mapa (escala, ubicacion y rotacion), ahora como plugins
       porque Cesium no sabe crearlos al construir el mapa y eso abortaba el
       cambio 2D/3D. La rotacion y la ubicacion se cuelgan en las columnas de
       las areas de esquina, como los demas botones de las herramientas; la
       escala es una lectura ancha y va en la banda de areaControls, que por eso
       debe cargarse antes que ella (parametros `order` = posicion en la fila
       y `openPosition` = banda superior o inferior). -->
  <link type="text/css" rel="stylesheet" href="../../../../ext/areaControls/areaControls.css">
