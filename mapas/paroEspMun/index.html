<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Visualizador base</title>

  <!-- fichero estilos -->
  <link href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />

  <!-- Ficheros javascript de la API -->
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

  <!-- Extensiones de la API-CNIG -->


  <!-- estilo básico -->
  <link href="./css/mapa.css" rel="stylesheet" />

  <!-- Importación librerías externas -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- proj4: reproyección de coordenadas. En 3D se usa para pasar los vértices
       del MVT (Web Mercator, EPSG:3857) a lon/lat. Es la misma librería y
       versión que usa mapas/vueloFotogrametrico. -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>

  <!-- pbf: decodificador de Protocol Buffers, para leer las teselas .pbf -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pbf@3.2.1/dist/pbf.min.js"></script>

  <!--
    Import map para el decodificador de MVT, que usa ext/MVTLayer.

    El bundle de @mapbox/vector-tile@2.0.3 es ESM puro y hace
    "import Point from '@mapbox/point-geometry'", un nombre de paquete que el
    navegador no sabe resolver por su cuenta, así que hace falta el import map.

    Ojo con point-geometry: el /index.js del paquete es CommonJS y no vale, pero
    jsdelivr lo sirve como ESM en el sufijo "+esm", y ahí sí hay export default.
    Medido: con esa URL el decodificador funciona y no hace falta ningún shim
    propio.
  -->
  <script type="importmap">
    {
      "imports": {
        "@mapbox/point-geometry": "https://cdn.jsdelivr.net/npm/@mapbox/point-geometry@0.1.0/+esm",
        "@mapbox/vector-tile": "https://cdn.jsdelivr.net/npm/@mapbox/vector-tile@2.0.3/index.min.js"
      }
    }
  </script>

  <!-- Importación librerías propias -->
  <script type="text/javascript" src="../../js/lib/transforms/formats.js"></script>


  <!-- Extensión personalizada -->
  <link type="text/css" rel="stylesheet" href="../../ext/attribution/attribution.css">
  <script type="text/javascript" src="../../ext/attribution/attribution.js"></script>

  <link type="text/css" rel="stylesheet" href="../../ext/cambioImpl/cambioImpl.css">
  <script src="../../ext/cambioImpl/cambioImpl.js" type="text/javascript"></script>
  <script type="text/javascript" src="../../ext/MVTLayer/MVTLayer.js"></script>

  <link type="text/css" rel="stylesheet" href="../../ext/selectorCapas/ext_backgorundLayers.css">
  <script src="../../ext/selectorCapas/ext_backgorundLayers.js" type="text/javascript"></script>

  <link type="text/css" rel="stylesheet" href="../../ext/selectorCapas/ext_layerSwitcher.css">
  <script src="../../ext/selectorCapas/ext_layerSwitcher.js" type="text/javascript"></script>

  <script src="../../ext/layergroup_cesium/layergroup_cesium.js" type="text/javascript"></script>

</head>

<body>

  <!-- Div carga -->
  <div id="cargaSVG">
    <img src="../../img/iconos/gear-spinner.svg">
  </div>


  <!-- Contenedor principal del mapa -->
  <div id="mapa"></div>

  <script type="text/javascript" src="./js/mapa.js">
  </script>
</body>

</html>
