<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Geoprocesos</title>

  <!-- fichero estilos -->
  <link href="../../js/api-idee/apiidee-1.1.0.ol.min.css" rel="stylesheet" />

  <!-- Ficheros javascript de la API-CNIG -->
  <script type="text/javascript" src="../../js/api-idee/browser-polyfill.js"></script>
  <script type="text/javascript" src="../../js/api-idee/apiidee-1.1.0.ol.min.js"></script>
  <script type="text/javascript" src="../../js/api-idee/configuration-1.1.0.js"></script>

  <!-- Cambio de implementación 2D/3D -->
  <link type="text/css" rel="stylesheet" href="../../ext/cambioImpl/cambioImpl.css">
  <script src="../../ext/cambioImpl/cambioImpl.js" type="text/javascript"></script>

  <script src="../../ext/selectorCapas/ext_layerSwitcher.js" type="text/javascript"></script>

  <script src="../../ext/layergroup_cesium/layergroup_cesium.js" type="text/javascript"></script>

  <!-- Herramienta de geoprocesos. Inyecta su propia hoja de estilos, así que
       no hace falta enlazarla aquí. -->
  <script src="../../ext/geoprocesos/geoprocesos.js" type="text/javascript"></script>

  <!-- estilo básico -->
  <link href="./css/mapa.css" rel="stylesheet" />

</head>

<body>

  <!-- Div carga -->
  <div id="cargaSVG">
    <img src="../../img/iconos/gear-spinner.svg" alt="Cargando…">
  </div>

  <!-- Contenedor principal del mapa -->
  <div id="mapaID"></div>

  <script type="text/javascript" src="./js/mapa.js"></script>

</body>

</html>
